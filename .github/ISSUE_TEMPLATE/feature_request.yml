name: Feature request
description: Suggest an idea or improvement for Nembrix.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describing the underlying problem — not just the
        solution — helps us find the best fit.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain point or workflow that's currently awkward or missing.
      placeholder: When I work across three connections, I can't…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like Nembrix to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other tools handle it.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true

name: Commit Lint

# Validate commit messages and the PR title against Conventional Commits.
# Locally the same rules run via the husky commit-msg hook; this is the
# server-side backstop so nothing slips through a PR.
on:
  pull_request:
    # Re-run when the title/body changes too, not just on new commits.
    types: [opened, edited, synchronize, reopened]

# A new push / edit to the same PR supersedes the older run.
concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── Validate every commit in the PR range ──────────────────────────
  commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so commitlint can read the PR commit range.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint PR commits
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # ─── Validate the PR title (used as the squash-merge commit subject) ─
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with commitlint.config.js type-enum.
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a lowercase letter.

            Conventional-commit subjects complete the sentence "if applied, this
            PR will …", so lead with a lowercase verb and put any proper noun
            (JavaScript, MongoDB, GitHub, …) after it.

              ✗ feat(scripting): JavaScript scripting on MongoDB
              ✓ feat(scripting): add MongoDB support to JavaScript scripting

            Format: <type>(<optional scope>): <lowercase subject>
            Edit the PR title (not the branch) — this check re-runs on save.

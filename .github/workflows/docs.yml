name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Static deploy → GitHub Pages. Media capture is intentionally NOT part
# of this workflow — screenshots live under apps/docs/public/media/ and
# are committed by hand from a developer's local run of
# `yarn docs:media`. See scripts/docs/README.md for why.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One install at the workspace root covers app + docs deps.
      - uses: ./.github/actions/setup

      - name: Build docs
        # Served from the custom domain nembrix.dev at the ROOT, so drop the
        # project-pages /nembrix base and set the canonical origin. The CNAME
        # file in apps/docs/public/ tells Pages the custom domain.
        run: yarn docs:build
        env:
          DOCS_BASE: /
          DOCS_SITE_URL: https://nembrix.dev

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

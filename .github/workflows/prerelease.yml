name: Pre-release (nightly)

# On every merge to main, refresh a single rolling "nightly" pre-release
# that points at the latest main and whose notes are regenerated from the
# PRs/commits merged since the last stable release. No binaries are built
# here — that stays on the manual Release workflow (release.yml). This is
# notes + metadata only, so it's cheap enough to run on every push.
#
# The result: a always-current `nightly` pre-release on the Releases page
# reflecting what's on main right now, with a changelog driven by the
# (validated) PR titles.

on:
  push:
    branches: [main]
    # Only auto-build nightly when the actual APP changes — an allow-list
    # of what the desktop build depends on. A docs/brand/CI/README-only
    # push no longer burns a (macOS-heavy) nightly build. To force a build
    # for something outside this list, use the manual workflow_dispatch
    # below. Keep in sync with what the build genuinely consumes.
    paths:
      - "apps/desktop/**"      # the app: frontend + src-tauri + crates
      - "package.json"         # root workspace deps / scripts
      - "yarn.lock"            # dependency lockfile
      - ".github/workflows/prerelease.yml"  # the build pipeline itself
  # Manual trigger — rebuild the rolling nightly from the current tip of
  # main on demand. Use this when a `chore:`-titled squash merge skipped
  # the automatic build (the gate below force-runs for manual dispatch),
  # or to re-cut nightly covering everything since the last release.
  workflow_dispatch:

# Don't let two merges in quick succession race on the same rolling tag.
# cancel-in-progress is fine here: the newest merge wins and supersedes
# an in-flight older run.
concurrency:
  group: prerelease-nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The single rolling tag reused for every nightly. Recreated each run so
  # it always points at the current main.
  NIGHTLY_TAG: nightly

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Gate: only re-cut nightly for commits that would move the version
  # under semver convention. `paths-ignore` above already drops
  # docs/markdown-only pushes; this narrows further to the Conventional-
  # Commit types that imply a release:
  #   feat  → minor      fix / perf → patch      *! (breaking) → major
  # Everything else (chore/docs/ci/test/refactor/style/build/revert) is
  # housekeeping that doesn't warrant a new build, so nightly is skipped.
  # A breaking-change marker (`!`) on ANY type still builds — a breaking
  # refactor is a release even though `refactor` normally isn't.
  # A manual run (workflow_dispatch) always builds regardless of subject —
  # the escape hatch to force a build after a skipped merge.
  # ─────────────────────────────────────────────────────────────────
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Inspect head commit subject
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A hand-triggered run always builds — the operator asked for it.
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "manual dispatch — forcing run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%s)
          echo "Head commit: $SUBJECT"
          # Allow-list the release-implying Conventional-Commit types.
          # A `!` breaking marker on any type (e.g. refactor!: …) also
          # builds, since that's a major release. Optional (scope) allowed.
          if [[ "$SUBJECT" =~ ^(feat|fix|perf)(\(.+\))?!?: ]]; then
            echo "version-bumping commit (feat/fix/perf) — building nightly."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SUBJECT" =~ ^[a-z]+(\(.+\))?!: ]]; then
            echo "breaking change (!) — building nightly."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "non-release commit — skipping nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Refresh nightly pre-release
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version + commit
        shell: bash
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # Re-point the rolling tag at the current commit. Force-update so the
      # nightly always tracks the tip of main.
      - name: Move nightly tag to HEAD
        shell: bash
        run: |
          git config user.name  "Nembrix release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git tag -f "$NIGHTLY_TAG"
          git push -f origin "refs/tags/${NIGHTLY_TAG}"

      # Changelog from Conventional Commits, filtered by cliff.toml (drops
      # ci/test/chore/style/build and *(ci)/*(test)/… scopes). `--unreleased`
      # covers everything merged since the last stable v* tag — the rolling
      # `nightly` tag is in cliff.toml's skip_tags, so it isn't a boundary.
      - id: cliff
        name: Generate nightly notes (git-cliff)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --strip header

      - id: release
        name: Create or update the nightly pre-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.NIGHTLY_TAG }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          NOTES: ${{ steps.cliff.outputs.content }}
        with:
          script: |
            const { TAG, VERSION, SHORT_SHA, NOTES } = process.env;
            const { owner, repo } = context.repo;

            const name = `Nightly (${VERSION} @ ${SHORT_SHA})`;
            const common = {
              owner, repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name,
              draft: false,
              prerelease: true,
            };

            // Notes come from the git-cliff step (Conventional Commits,
            // ci/test/chore filtered out). Fall back to GitHub's PR-based
            // auto-notes only if cliff produced nothing for the range.
            let changelog = (NOTES || "").trim();
            if (!changelog) {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner, repo,
                tag_name: TAG,
                target_commitish: context.sha,
              });
              changelog = notes.data.body;
            }
            const body =
              `> ⚠️ **Pre-release build of \`main\`** — automatically updated on every merge.\n` +
              `> Commit \`${SHORT_SHA}\`. For stable, see the latest non-pre-release.\n\n` +
              changelog;

            // Find an existing nightly release for this tag and update it
            // in place, otherwise create it. Reusing the same release id
            // keeps a single rolling entry on the Releases page.
            const list = await github.rest.repos.listReleases({
              owner, repo, per_page: 100,
            });
            const existing = list.data.find(r => r.tag_name === TAG);

            if (existing) {
              core.info(`Updating existing nightly release ${existing.id}`);
              await github.rest.repos.updateRelease({
                ...common,
                release_id: existing.id,
                body,
              });
              core.setOutput("release_id", String(existing.id));
            } else {
              core.info(`Creating new nightly release for ${TAG}`);
              const created = await github.rest.repos.createRelease({ ...common, body });
              core.setOutput("release_id", String(created.data.id));
            }

  # ─────────────────────────────────────────────────────────────────
  # Build nightly binaries and attach them to the rolling `nightly`
  # release. nightly ships the formats a tester actually installs: macOS
  # as two separate .dmg builds (Apple Silicon + Intel), Windows x64
  # .msi/.exe, and Linux x86_64 .AppImage/.deb/.rpm. Keep this matrix in
  # sync with release.yml's build job when the toolchain or signing setup
  # changes — the two are intentionally parallel.
  #
  # Runs after `nightly` (which creates/refreshes the release these
  # assets attach to). Because `nightly` is a single rolling release,
  # every run's assets collide by name with the previous run's — so we
  # delete this platform's stale assets before tauri-action re-uploads.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build nightly (${{ matrix.label }})
    needs: nightly
    strategy:
      fail-fast: false  # One platform failing shouldn't kill the others.
      matrix:
        include:
          - label: macOS (Apple Silicon)
            slug: macos-aarch64
            os: macos-14
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            slug: macos-x86_64
            os: macos-14
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows x64
            slug: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          - label: Linux x86_64
            slug: linux-x86_64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    # Bind to the same GitHub Environment the manual Release workflow uses
    # (release.yml). The Apple codesigning + notarization secrets live in
    # this environment, NOT at repo scope — without this line nightly's
    # macOS build can't see APPLE_CERTIFICATE, so tauri-action calls
    # `security import` on an empty cert and the bundle step fails with
    # "SecKeychainItemImport: One or more parameters ... were not valid".
    # The environment has no required-reviewer gate, so nightly still runs
    # unattended on every push.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ─── Toolchain ─────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop -> apps/desktop/target
          key: nightly-${{ matrix.slug }}

      # ─── Linux build deps ──────────────────────────────────────
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ─── Frontend ──────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ─── Updater endpoint ──────────────────────────────────────
      # Same placeholder-substitution as release.yml: bake the real repo
      # coordinates into the updater endpoint before building.
      - name: Set updater endpoint
        shell: bash
        run: |
          CONF=apps/desktop/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          sed -e "s/__OWNER__/${{ github.repository_owner }}/g" \
              -e "s/__REPO__/${{ github.event.repository.name }}/g" \
              "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          echo "Updater endpoint:"; grep -A1 endpoints "$CONF" || true

      # ─── Clear this platform's stale nightly assets ────────────
      # The nightly release is rolling, so last run's dmg/msi/etc. still
      # hang off it and would collide by name with this run's uploads.
      # Delete only the assets whose names match this platform's outputs.
      - name: Delete stale nightly assets for this platform
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.nightly.outputs.release_id }}
          SLUG: ${{ matrix.slug }}
        with:
          script: |
            const { RELEASE_ID, SLUG } = process.env;
            const { owner, repo } = context.repo;
            // Platform → filename fragments its artifacts contain. Only
            // delete assets matching this matrix leg so parallel legs
            // don't race deleting each other's uploads.
            // Arch-specific for macOS: the Silicon and Intel legs run in
            // parallel and their dmg/tar.gz names differ by arch, so each
            // must delete ONLY its own arch's stale assets or they'd race
            // deleting each other's uploads.
            const patterns = {
              'macos-aarch64':  [/aarch64\.dmg$/i, /aarch64\.app\.tar\.gz$/i],
              'macos-x86_64':   [/x64\.dmg$/i, /x64\.app\.tar\.gz$/i],
              'windows-x86_64': [/\.msi$/i, /-setup\.exe$/i, /\.exe$/i],
              'linux-x86_64':   [/\.AppImage$/i, /\.deb$/i, /\.rpm$/i],
            }[SLUG] || [];
            const assets = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: Number(RELEASE_ID), per_page: 100,
            });
            for (const a of assets.data) {
              // Also drop the updater manifest + its sig each run; it's
              // regenerated from whatever this run produces.
              const isUpdater = a.name === 'latest.json';
              if (isUpdater || patterns.some((re) => re.test(a.name))) {
                core.info(`Deleting stale asset ${a.name} (id ${a.id})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner, repo, asset_id: a.id,
                });
              }
            }

      # ─── Tauri build + sign + upload to the nightly release ────
      - name: Build & upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.nightly.outputs.release_id }}
          args: ${{ matrix.args }}
          projectPath: apps/desktop
          includeUpdaterJson: true

  # ─────────────────────────────────────────────────────────────────
  # After every platform has uploaded, rewrite the release body to lead
  # with a per-OS "Downloads" table linking each installer directly, so
  # a visitor picks their OS instead of scanning ~14 raw asset filenames
  # (dmg/msi/exe/AppImage/deb/rpm plus .sig sidecars and latest.json).
  # Runs after `build` because the assets must exist before we can link
  # them. `if: always()` so a single failed platform still refreshes the
  # table for the platforms that did upload.
  # ─────────────────────────────────────────────────────────────────
  downloads:
    name: Refresh per-OS download table
    needs: [nightly, build]
    if: always() && needs.nightly.outputs.release_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.nightly.outputs.release_id }}
          TAG: ${{ env.NIGHTLY_TAG }}
        with:
          script: |
            const { RELEASE_ID, TAG } = process.env;
            const { owner, repo } = context.repo;

            const rel = await github.rest.repos.getRelease({
              owner, repo, release_id: Number(RELEASE_ID),
            });
            const assets = (await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: Number(RELEASE_ID), per_page: 100,
            })).data;

            // Direct, tag-stable download URL for an asset by name.
            const url = (name) =>
              `https://github.com/${owner}/${repo}/releases/download/${TAG}/${encodeURIComponent(name)}`;
            // First asset whose name matches — skip signatures/manifests.
            const find = (re) => {
              const a = assets.find(
                (x) => re.test(x.name) && !/\.sig$/i.test(x.name) && x.name !== "latest.json",
              );
              return a ? a.name : null;
            };

            // One row per OS/build → the installer a user actually wants,
            // with a human-facing label (people don't know "MSI" vs
            // "setup.exe", or which .dmg fits their chip). macOS ships two
            // separate builds: Apple Silicon and Intel.
            const rows = [
              ["🍎 macOS", "Apple Silicon", /aarch64\.dmg$/i],
              ["🍎 macOS", "Intel",         /x64\.dmg$/i],
              ["🪟 Windows", "Installer (.exe)",      /_x64-setup\.exe$/i],
              ["🪟 Windows", "MSI package",           /\.msi$/i],
              ["🐧 Linux",   "AppImage (portable)",   /\.AppImage$/i],
              ["🐧 Linux",   "Debian (.deb)", /\.deb$/i],
              ["🐧 Linux",   "Fedora (.rpm)", /\.rpm$/i],
            ];

            const lines = ["## Downloads", "", "| OS | Build | File |", "| --- | --- | --- |"];
            let any = false;
            for (const [os, desc, re] of rows) {
              const name = find(re);
              if (!name) continue;
              any = true;
              lines.push(`| ${os} | ${desc} | [\`${name}\`](${url(name)}) |`);
            }
            const table = any
              ? lines.join("\n")
              : "## Downloads\n\n_Builds are still uploading — refresh shortly._";

            // Strip any previous Downloads block, then prepend the fresh
            // one above the existing changelog/preamble so it stays idempotent.
            const prevBody = rel.data.body || "";
            const withoutOld = prevBody.replace(/## Downloads[\s\S]*?(?=\n## |\n> |$)/, "").trim();
            const body = `${table}\n\n${withoutOld}`.trim();

            await github.rest.repos.updateRelease({
              owner, repo, release_id: Number(RELEASE_ID), body,
            });
            core.info("Refreshed per-OS download table.");

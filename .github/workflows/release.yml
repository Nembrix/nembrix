name: Release

# Manual trigger only — no tag/push events. You bump the version,
# commit, then click "Run workflow" in the Actions tab. The workflow
# creates a draft GitHub Release tagged v<version>, builds artifacts
# in parallel across the four target platforms, attaches them to the
# release, and (when "publish" is true) flips it from draft to public.

on:
  workflow_dispatch:
    # No version input by design. The version is the single source of truth in
    # apps/desktop/src-tauri/tauri.conf.json. To release a new version, bump it
    # first via the Bump Version workflow (which opens a PR); this workflow then
    # builds whatever is on disk and verifies it's ahead of the latest release.
    inputs:
      publish:
        description: "Publish the release immediately (otherwise leave as draft)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write   # open the docs-link PR when the direct push is declined

# One release run per ref at a time — avoids two concurrent runs racing each
# other when re-clicking the button. Doesn't cancel in progress (a half-built
# release shouldn't be interrupted).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 0: verify the code before we tag, bump, or spend ~15 min building
  # installers. Runs the fast gate from ci.yml (lint + typecheck + unit tests)
  # so a red build can't ship a release. Rust is compiled by the build matrix
  # itself, so a compile break there already blocks the release; this catches
  # the frontend/JS side up front, cheaply. `prepare` depends on it.
  # ─────────────────────────────────────────────────────────────────
  verify:
    name: Verify (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint (desktop)
        run: yarn workspace @nembrix/desktop lint
      - name: Typecheck (desktop)
        run: yarn workspace @nembrix/desktop tsc -b --noEmit
      - name: Unit tests (desktop)
        run: yarn workspace @nembrix/desktop test:unit

  # Stage 1: prepare the draft release so each platform job can
  # upload to it. Reads the version from inputs or tauri.conf.json.
  # ─────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate the whole release behind the "release" environment. Configure
    # its required reviewers in repo Settings → Environments → release so
    # the run pauses for approval before any release is created — only
    # designated approvers can actually cut a release, regardless of who
    # clicked "Run workflow".
    # NOTE: editor YAML-schema linters may flag `environment: release` as
    # "not valid" — that's a known false positive (they can't see the
    # repo's configured environments). GitHub Actions accepts it fine.
    environment: release
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.create.outputs.release_id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the full history + tags to compute the range.
          fetch-depth: 0

      # The version is read from the code — the single source of truth — never
      # from a workflow input. To ship a new version you bump it first (Bump
      # Version workflow → PR → merge); this workflow releases whatever is on
      # disk.
      - id: resolve
        name: Resolve version from code
        shell: bash
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "On-disk version: $VERSION"

      # Verify the on-disk version is a NEW release ahead of the latest one. If
      # it isn't (the tag already exists / it's not greater than the last
      # release), the bump hasn't happened — stop and point at Bump Version,
      # rather than re-releasing the same version or overwriting a tag.
      - name: Verify version is ahead of the latest release
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"

          # Fast, explicit gate: the target tag must not already exist.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists — the code version wasn't bumped. Run the Bump Version workflow, merge its PR, then re-run Release."
            exit 1
          fi

          # Compare against the highest existing v* tag: the on-disk version must
          # be strictly greater. `sort -V` gives semver-ish ordering; if VERSION
          # sorts <= the latest tag, it's not a forward release.
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            echo "No prior v* tag — first release of $VERSION. OK."
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
          if [[ "$VERSION" == "$LATEST" || "$HIGHEST" != "$VERSION" ]]; then
            echo "::error::On-disk version $VERSION is not ahead of the latest release v$LATEST. Bump the version first (Bump Version workflow → merge PR), then re-run Release."
            exit 1
          fi
          echo "$VERSION is ahead of the latest release v$LATEST — ok to release."

      # Point the docs landing pages' direct download links (EN + FR) at the
      # release being cut. Runs on EVERY release — driven by the resolved
      # version, not the manual `version` input — so the links never go stale
      # even when a release is triggered without typing a version. The "old"
      # version is read from the docs themselves (the "**vX.Y.Z**" line), so a
      # re-run or an already-synced doc is a no-op. Commits only when something
      # actually changed.
      - name: Sync docs download links to the release version
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.version }}
        run: |
          set -e
          EN=apps/docs/src/content/docs/index.mdx
          # The docs' current version, parsed from the "**vX.Y.Z**" marker.
          OLD=$(grep -oE '\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*' "$EN" | head -1 | tr -d '*v')
          if [[ -z "$OLD" ]]; then
            echo "::warning::Could not find a **vX.Y.Z** marker in $EN — skipping docs link sync."
            exit 0
          fi
          if [[ "$OLD" == "$TARGET" ]]; then
            echo "Docs already point at v$TARGET — nothing to sync."
            exit 0
          fi
          echo "Syncing download links: v$OLD → v$TARGET"
          # README carries the same direct-download table as the docs pages and
          # drifts the same way, so it's synced here too. Its heading reads
          # "### Download vX.Y.Z" rather than the docs' "**vX.Y.Z**" marker, so
          # it gets its own substitution.
          for f in apps/docs/src/content/docs/index.mdx apps/docs/src/content/docs/fr/index.mdx README.md; do
            sed -i \
              -e "s#/download/v${OLD}/Nembrix_${OLD}_#/download/v${TARGET}/Nembrix_${TARGET}_#g" \
              -e "s#/download/v${OLD}/Nembrix-${OLD}-#/download/v${TARGET}/Nembrix-${TARGET}-#g" \
              -e "s#\*\*v${OLD}\*\*#**v${TARGET}**#g" \
              -e "s|^### Download v${OLD}\$|### Download v${TARGET}|g" \
              "$f"
          done
          git config user.name  "Nembrix release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add apps/docs/src/content/docs/index.mdx apps/docs/src/content/docs/fr/index.mdx README.md
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
          else
            git commit -m "docs: point download links at v$TARGET"
            # main is protected (changes must go through a PR) and the release
            # bot's GITHUB_TOKEN isn't in the ruleset bypass list, so a direct
            # push is declined (GH013). This sync must NEVER block the release
            # build, so a failure here is never fatal — but it also must not be
            # silently discarded, which is what used to happen: the commit was
            # made, the push declined, the runner thrown away, and the docs sat
            # on v0.4.0 through four releases. Fall back to opening a PR so the
            # work survives as something a human can merge.
            if git push origin HEAD:main; then
              echo "Pushed download-link update to main."
            else
              BRANCH="docs/download-links-v$TARGET"
              # printf, not an inline multi-line string: YAML block scalars keep
              # the step's indentation, which would render as code blocks in the
              # PR body.
              PR_BODY=$(printf '%s\n\n%s\n\n%s\n' \
                "Automated by the Release workflow: the direct push to \`main\` was declined by branch protection, so the download-link sync is offered as a PR instead." \
                "Moves the download links in \`README.md\` and both docs landing pages from **v$OLD** to **v$TARGET**." \
                "Safe to merge once the v$TARGET release is **published** — while it is still a draft, its release assets 404.")
              if git push -f origin "HEAD:$BRANCH" \
                && GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr create \
                     --base main --head "$BRANCH" \
                     --title "docs: point download links at v$TARGET" \
                     --body "$PR_BODY"; then
                echo "Opened docs-link PR for v$TARGET (direct push declined)."
              else
                echo "::warning::Could not push or open a PR for the download-link \
          update (branch protection / missing bypass). Release continues; move the \
          links manually. Links: v$OLD → v$TARGET."
              fi
            fi
          fi

      # Build the changelog body from Conventional Commits. cliff.toml filters
      # out ci/test/chore/style/build (and *(ci)/*(test)/… scopes), so the
      # notes only carry user-facing changes. `--unreleased --tag` renders the
      # commits since the previous v* tag under the version being cut.
      - id: cliff
        name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.resolve.outputs.tag }} --strip header

      - id: create
        name: Create / update draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          NOTES: ${{ steps.cliff.outputs.content }}
        with:
          script: |
            const { TAG, VERSION, PRERELEASE, NOTES } = process.env;
            // Find an existing release by tag (so reruns don't pile up
            // duplicate drafts). Releases endpoint paginates; 100 is
            // plenty for our cadence.
            const list = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100,
            });
            const existing = list.data.find(r => r.tag_name === TAG);
            // Fall back to GitHub's auto-notes only if git-cliff produced
            // nothing (e.g. no user-facing commits in the range).
            const body = (NOTES || "").trim();
            let release;
            if (existing) {
              core.info(`Reusing existing release ${existing.id} for ${TAG}`);
              if (body) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  release_id: existing.id,
                  body,
                });
              }
              release = existing;
            } else {
              core.info(`Creating new draft release for ${TAG}`);
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                tag_name: TAG,
                name: `Nembrix ${VERSION}`,
                draft: true,
                prerelease: PRERELEASE === "true",
                body: body || undefined,
                generate_release_notes: !body,
              });
              release = created.data;
            }
            core.setOutput("release_id", String(release.id));
            core.setOutput("upload_url", release.upload_url);

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: build each target in parallel. Uses tauri-action which
  # handles the signing (Apple notarize, Windows code-sign) when the
  # right secrets are present, and falls through cleanly when not.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    # The Apple codesigning + notarization secrets (APPLE_CERTIFICATE et al.)
    # live in the `release` GitHub Environment, not at repo scope, so the
    # build must bind to it or `security import` gets an empty cert and the
    # macOS bundle step fails. The environment is restricted to `main`.
    environment: release
    strategy:
      fail-fast: false  # One platform failing shouldn't kill the others.
      matrix:
        include:
          # ── macOS (separate Apple Silicon + Intel; no universal) ─
          - label: macOS Apple Silicon (aarch64)
            slug: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS Intel (x86_64)
            slug: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

          # ── Windows (both .msi and .exe per arch) ──────────────
          - label: Windows x64
            slug: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          - label: Windows ARM64
            slug: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc

          # ── Linux x86_64 (emits .deb, .AppImage, .rpm) ─────────
          # arm64 Linux + 32-bit Windows are intentionally omitted —
          # they need cross-build work; tracked in the issue tracker.
          - label: Linux x86_64
            slug: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    # Cross-platform Tauri build with cold Rust compiles (Windows/macOS are the
    # slowest); 60 min gives ample headroom while still failing a wedged runner
    # instead of letting it hang for the 6-hour default.
    timeout-minutes: 60
    # Exposed job-wide so the Windows signing steps can gate on it in a
    # single place (`if: ... && env.SIGNPATH_API_TOKEN != ''`). When the
    # SignPath OSS token isn't set yet, every signing step is skipped and
    # the build still ships unsigned installers.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ─── Toolchain ─────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          # Required when pinning by SHA — the action can't read the
          # toolchain from the ref name like it does with @stable.
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop -> apps/desktop/target
          key: ${{ matrix.target }}

      # ─── Linux build deps ──────────────────────────────────────
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ─── Frontend ──────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ─── Updater endpoint ──────────────────────────────────────
      # tauri.conf.json ships the updater endpoint with __OWNER__/__REPO__
      # placeholders so the repo is forkable without editing config. Bake
      # the actual repo coordinates in here, just before the build, from
      # the GitHub context. The pubkey is already committed (it isn't
      # secret); only the matching TAURI_SIGNING_PRIVATE_KEY secret signs.
      - name: Set updater endpoint
        shell: bash
        run: |
          CONF=apps/desktop/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          sed -e "s/__OWNER__/${{ github.repository_owner }}/g" \
              -e "s/__REPO__/${{ github.event.repository.name }}/g" \
              "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          echo "Updater endpoint:"; grep -A1 endpoints "$CONF"

      # ─── Tauri build + sign + upload ───────────────────────────
      - name: Build & upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Tauri auto-updater: signs the update bundles + latest.json.
          #    When TAURI_SIGNING_PRIVATE_KEY is unset the build still
          #    produces installers, but the .sig files (and thus a working
          #    updater) are skipped — ship the key secret to enable updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # The frontend project + Tauri shell both live under the
          # desktop app workspace. tauri-action runs `yarn build`
          # from this path, so vite + tsc see the right tsconfig.
          projectPath: apps/desktop
          # Do NOT let each matrix job upload latest.json — every job would
          # upload its own copy and clobber the others (GitHub rejects
          # duplicate asset names, so the manifest ends up as whichever job
          # finished last, referencing a single platform + stale URLs). The
          # dedicated `manifest` job assembles ONE correct latest.json from
          # every platform's .sig once all builds finish.
          # NOTE: the input is `uploadUpdaterJson` (NOT `includeUpdaterJson`,
          # which tauri-action silently ignores → the buggy default of
          # uploading a per-job manifest). Keep uploadUpdaterSignatures on so
          # the .sig files the manifest job reads still land on the release.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          # Pull request builds skip signing/uploading. The tag is set
          # via the prepare job's tag output; tauri-action attaches the
          # built artifacts to that release.

      # ─── Friendlier macOS .dmg names ───────────────────────────
      # tauri-action names the dmg from the Rust target arch
      # (…_aarch64.dmg / …_x64.dmg). Rename the uploaded .dmg *release
      # asset* to the human labels users expect. Only the .dmg (the human
      # download) is renamed — the .app.tar.gz updater bundles keep their
      # arch names, since latest.json references them by URL and renaming
      # would break auto-update.
      - name: Rename macOS dmg asset
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SLUG" in
            macos-aarch64) from="Nembrix_${VERSION}_aarch64.dmg"; to="Nembrix_${VERSION}_macOS_Apple_Silicon.dmg" ;;
            macos-x86_64)  from="Nembrix_${VERSION}_x64.dmg";     to="Nembrix_${VERSION}_macOS_Intel.dmg" ;;
            *) echo "No dmg rename for slug $SLUG"; exit 0 ;;
          esac
          # tauri-action uploads can lag; poll for the asset id.
          for i in $(seq 1 30); do
            aid=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq ".[] | select(.name==\"${from}\") | .id" 2>/dev/null || true)
            [ -n "$aid" ] && break
            echo "waiting for ${from} to appear (try $i)…"; sleep 4
          done
          if [ -z "${aid:-}" ]; then
            echo "::warning::${from} not found; leaving dmg name unchanged."
            exit 0
          fi
          gh api -X PATCH "repos/${REPO}/releases/assets/${aid}" -f name="${to}" --jq '.name'
          echo "Renamed ${from} → ${to}"

      # ─── Windows signing (separate pass — Tauri's signing hook is
      #     Apple-only; on Windows we sign the produced installers after
      #     the build via SignPath's free OSS program). SignPath is a
      #     cloud signer: there's no .pfx and no cert to manage — we submit
      #     each installer to a signing policy and download the signed file
      #     back in place. Signatures are timestamped server-side, so they
      #     stay valid after the underlying cert rotates. Only runs when
      #     SIGNPATH_API_TOKEN is present, so unsigned dev releases work.
      #
      #     The org id / project / policy slugs are non-secret and come
      #     from repo *variables* (vars.*); only the API token is a secret.
      #     Collect the installers first so SignPath signs a single zip,
      #     then unpack the signed artifacts back over the originals.
      # SignPath signs an artifact that was uploaded with actions/upload-artifact
      # (referenced by id), not a local path — so the flow is:
      #   stage → upload → submit (by artifact id) → download signed → restore.
      - name: Stage Windows installers for signing
        id: stage_signpath
        if: startsWith(matrix.os, 'windows') && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath-in | Out-Null
          # Flatten every msi + exe from the (target-dependent) bundle tree
          # into one folder so the uploaded artifact is flat.
          Get-ChildItem -Path apps/desktop/target -Recurse -Include *.msi,*.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination signpath-in }
          Get-ChildItem signpath-in

      - name: Upload unsigned installers
        id: upload_unsigned
        if: startsWith(matrix.os, 'windows') && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers-unsigned
          path: signpath-in

      - name: Sign Windows installers (SignPath)
        if: startsWith(matrix.os, 'windows') && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          # The artifact uploaded above, referenced by the upload step's id.
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Signed files are written here for the restore step to pick up.
          output-artifact-directory: signpath-out

      - name: Restore signed installers
        if: startsWith(matrix.os, 'windows') && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          # Copy each signed installer back over the original in the bundle
          # tree (matched by file name) so the downstream collect step picks
          # up the signed versions.
          Get-ChildItem signpath-out -Recurse -Include *.msi,*.exe | ForEach-Object {
            $signed = $_
            Get-ChildItem -Path apps/desktop/target -Recurse -Include *.msi,*.exe |
              Where-Object { $_.Name -eq $signed.Name } |
              ForEach-Object { Copy-Item $signed.FullName -Destination $_.FullName -Force }
          }

      # ─── Collect bundles into release/<slug>/ ───────────────────
      # Walk apps/desktop/target/**/release/bundle and pull out every
      # installer/package format Tauri emits. The exact subfolder layout
      # varies by target (universal vs single-triple), so we glob the
      # whole tree rather than hard-coding paths.
      - name: Collect bundles (unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          DEST="release/${VERSION}/${SLUG}"
          mkdir -p "$DEST"
          # -path is the simplest portable way to scope the search.
          find apps/desktop/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' \
            -o -name '*.app.tar.gz' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.AppImage' \
            -o -name '*.msi' \
            -o -name '*.exe' \) \
            -exec cp -v {} "$DEST/" \;
          # Match the friendlier .dmg name we give the release asset, so the
          # checksums.txt / manifest.json built from these artifacts line up
          # with what users download. Only the .dmg is renamed (not the
          # .app.tar.gz updater bundle).
          [ -f "$DEST/Nembrix_${VERSION}_aarch64.dmg" ] && \
            mv "$DEST/Nembrix_${VERSION}_aarch64.dmg" "$DEST/Nembrix_${VERSION}_macOS_Apple_Silicon.dmg" || true
          [ -f "$DEST/Nembrix_${VERSION}_x64.dmg" ] && \
            mv "$DEST/Nembrix_${VERSION}_x64.dmg" "$DEST/Nembrix_${VERSION}_macOS_Intel.dmg" || true
          echo "── contents of $DEST ──"
          ls -la "$DEST" || true

      - name: Collect bundles (windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          $dest = "release/$env:VERSION/$env:SLUG"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $files = Get-ChildItem `
            -Path apps/desktop/target `
            -Recurse `
            -Include *.msi,*.exe `
            | Where-Object { $_.FullName -match 'release[\\/]bundle[\\/]' }
          foreach ($f in $files) {
            Copy-Item -Path $f.FullName -Destination $dest -Force
            Write-Host "copied $($f.FullName)"
          }
          Get-ChildItem $dest

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nembrix-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: release/${{ needs.prepare.outputs.version }}/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Stage 2.5: gather every per-platform artifact, generate a
  # checksums.txt (sha256 of every file) and a structured
  # manifest.json, and attach both to the GitHub Release alongside
  # the loose installer assets that tauri-action already uploaded.
  # ─────────────────────────────────────────────────────────────────
  manifest:
    name: Attach checksums + manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pulls every artifact uploaded by the matrix build jobs into
      # ./release/<version>/<slug>/<files…> — same layout the build
      # jobs produced locally.
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nembrix-${{ needs.prepare.outputs.version }}-*
          path: release/${{ needs.prepare.outputs.version }}
          merge-multiple: false

      - name: Generate checksums.txt and manifest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd "release/${VERSION}"

          # Strip the "nembrix-<version>-" prefix from artifact dir
          # names so the folder layout is release/<version>/<slug>/.
          for d in nembrix-${VERSION}-*/; do
            slug="${d#nembrix-${VERSION}-}"
            slug="${slug%/}"
            mv "$d" "$slug"
          done

          ls -laR

          # SHA256 every file (paths relative to the version folder).
          : > checksums.txt
          find . -type f \
            ! -name checksums.txt \
            ! -name manifest.json \
            -print0 \
          | sort -z \
          | xargs -0 sha256sum > checksums.txt
          echo "── checksums.txt ──"
          cat checksums.txt

          # Build a structured manifest. Each entry: platform, arch,
          # file (relative path), size in bytes, sha256.
          python3 - "$VERSION" <<'PY' > manifest.json
          import hashlib, json, os, sys
          version = sys.argv[1]
          entries = []
          for slug in sorted(os.listdir('.')):
              if not os.path.isdir(slug):
                  continue
              # slug is e.g. "macos-aarch64", "windows-x86_64".
              parts = slug.split('-', 1)
              platform = parts[0]
              arch = parts[1] if len(parts) > 1 else ''
              for fname in sorted(os.listdir(slug)):
                  fpath = os.path.join(slug, fname)
                  if not os.path.isfile(fpath):
                      continue
                  h = hashlib.sha256()
                  with open(fpath, 'rb') as f:
                      for chunk in iter(lambda: f.read(1 << 20), b''):
                          h.update(chunk)
                  entries.append({
                      'platform': platform,
                      'arch': arch,
                      'slug': slug,
                      'file': fname,
                      'size': os.path.getsize(fpath),
                      'sha256': h.hexdigest(),
                  })
          print(json.dumps({
              'version': version,
              'artifacts': entries,
          }, indent=2))
          PY
          echo "── manifest.json ──"
          cat manifest.json

      # ─── Assemble the ONE correct latest.json ──────────────────
      # Build the updater manifest from the RELEASE ASSETS (via the API),
      # not the downloaded workflow artifacts. The release assets carry the
      # arch-suffixed names tauri-action publishes (e.g.
      # Nembrix_0.1.0_aarch64.app.tar.gz) and — crucially — the .sig files;
      # the raw workflow artifacts do NOT (macOS bundles are the arch-less
      # `Nembrix.app.tar.gz`, and no .sig is bundled). For each update
      # bundle we fetch its .sig asset's content and map the bundle name to
      # its Tauri updater platform key. Race-free: one manifest, every
      # shipped platform, URLs on the public release-download path.
      - name: Assemble latest.json (updater manifest)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { RELEASE_ID, VERSION, TAG } = process.env;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${TAG}`;

            // Map an update-bundle filename to its Tauri updater key(s).
            const keysFor = (n) => {
              if (n.endsWith('_aarch64.app.tar.gz')) return ['darwin-aarch64', 'darwin-aarch64-app'];
              if (n.endsWith('_x64.app.tar.gz'))     return ['darwin-x86_64', 'darwin-x86_64-app'];
              if (n.endsWith('_amd64.AppImage'))     return ['linux-x86_64', 'linux-x86_64-appimage'];
              if (n.endsWith('_x64-setup.exe'))      return ['windows-x86_64', 'windows-x86_64-nsis'];
              if (n.endsWith('_arm64-setup.exe'))    return ['windows-aarch64', 'windows-aarch64-nsis'];
              // .msi register only the -msi alias so they don't override NSIS.
              if (n.endsWith('_x64_en-US.msi'))      return ['windows-x86_64-msi'];
              if (n.endsWith('_arm64_en-US.msi'))    return ['windows-aarch64-msi'];
              return [];
            };

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(RELEASE_ID), per_page: 100,
            });
            const byName = new Map(assets.map(a => [a.name, a]));

            const platforms = {};
            for (const a of assets) {
              const ks = keysFor(a.name);
              if (!ks.length) continue;
              const sigAsset = byName.get(a.name + '.sig');
              if (!sigAsset) { core.warning(`No .sig for ${a.name}; skipping`); continue; }
              // Download the .sig content. octokit's getReleaseAsset with an
              // octet-stream accept redirects to a signed URL that octokit
              // mishandles (esp. on draft releases) — it returned a 404 body,
              // not bytes. Use fetch() on the asset API URL instead: it follows
              // the 302 to storage natively with the token attached.
              const res = await fetch(sigAsset.url, {
                headers: {
                  Authorization: `token ${process.env.GITHUB_TOKEN}`,
                  Accept: 'application/octet-stream',
                  'User-Agent': 'nembrix-release',
                },
              });
              if (!res.ok) { core.setFailed(`Failed to fetch ${sigAsset.name}: HTTP ${res.status}`); return; }
              const signature = (await res.text()).trim();
              if (!signature) { core.setFailed(`Empty signature for ${sigAsset.name}`); return; }
              for (const k of ks) platforms[k] = { signature, url: `${base}/${a.name}` };
            }

            const keys = Object.keys(platforms);
            core.info(`latest.json platform keys (${keys.length}): ${keys.sort().join(', ')}`);
            if (keys.length === 0) core.setFailed('latest.json has zero platforms — manifest would be empty.');

            const out = {
              version: VERSION,
              notes: `Nembrix ${VERSION}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.mkdirSync(`release/${VERSION}`, { recursive: true });
            fs.writeFileSync(`release/${VERSION}/latest.json`, JSON.stringify(out, null, 2));

      - name: Upload checksums + manifest to the Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { RELEASE_ID, VERSION } = process.env;
            const dir = `release/${VERSION}`;
            const files = ['checksums.txt', 'manifest.json', 'latest.json'];

            // Drop any prior copies on the release so reruns don't
            // collide on the same name (GitHub rejects duplicates).
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(RELEASE_ID),
              per_page: 100,
            });
            for (const a of assets.data) {
              if (files.includes(a.name)) {
                core.info(`Deleting existing asset ${a.name} (id ${a.id})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  asset_id: a.id,
                });
              }
            }

            for (const name of files) {
              const p = path.join(dir, name);
              const data = fs.readFileSync(p);
              core.info(`Uploading ${name} (${data.length} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                release_id: Number(RELEASE_ID),
                name,
                data,
              });
            }

  # ─────────────────────────────────────────────────────────────────
  # Stage 3a: update the Homebrew tap so `brew install --cask
  # nembrix` resolves to the new version. Skipped silently if the
  # HOMEBREW_TAP_TOKEN secret isn't configured.
  # ─────────────────────────────────────────────────────────────────
  brew:
    name: Update Homebrew tap
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.prerelease != 'true' }}
    # HOMEBREW_TAP_TOKEN is a PAT with write access to the tap repo — scope
    # it to the `release` environment (restricted to `main`) so it's never
    # exposed to workflow runs on other branches or PRs. The env carries no
    # required reviewers, so binding here adds no approval pause.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tap secret
        id: gate
        run: |
          if [[ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping brew tap update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for dmg, compute SHA, render cask, push to tap
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Tap repo defaults to <owner>/homebrew-<repo>. Override with
          # the HOMEBREW_TAP_REPO secret (e.g. "myorg/homebrew-tools").
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO || format('{0}/homebrew-{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set -euo pipefail

          # Fetch both per-arch dmgs and compute each sha256. The dmg
          # uploads from the macOS build jobs race us, so poll until each
          # asset is downloadable (or fail after 5 min).
          fetch_sha() {
            local file="$1" out="$2"
            local url="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/${file}"
            echo "Fetching $url"
            for i in $(seq 1 60); do
              STATUS=$(curl -s -o "$out" -w "%{http_code}" -L -H "Authorization: token ${GH_TOKEN}" "$url" || true)
              if [[ "$STATUS" == "200" ]] && [[ -s "$out" ]]; then
                echo "  ready (try $i)"; break
              fi
              echo "  not ready (try $i, status=$STATUS); sleeping…"; sleep 5
            done
            test -s "$out"
          }

          fetch_sha "Nembrix_${VERSION}_macOS_Apple_Silicon.dmg" dmg-arm.bin
          fetch_sha "Nembrix_${VERSION}_macOS_Intel.dmg"     dmg-x64.bin
          SHA_ARM=$(sha256sum dmg-arm.bin | awk '{print $1}')
          SHA_X64=$(sha256sum dmg-x64.bin | awk '{print $1}')
          echo "sha256 arm: $SHA_ARM"
          echo "sha256 x64: $SHA_X64"

          # Render the cask template.
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_ARM__/${SHA_ARM}/g" \
            -e "s/__SHA256_X64__/${SHA_X64}/g" \
            -e "s/__OWNER__/${OWNER}/g" \
            -e "s/__REPO__/${REPO}/g" \
            .cask/nembrix.rb.tmpl > /tmp/nembrix.rb

          # Clone the tap, drop the rendered cask in, commit, push.
          git config --global user.name  "Nembrix release bot"
          git config --global user.email "release-bot@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

          mkdir -p tap/Casks
          mv /tmp/nembrix.rb tap/Casks/nembrix.rb

          cd tap
          git add Casks/nembrix.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged; nothing to push."
          else
            git commit -m "nembrix ${VERSION}"
            git push
            echo "Pushed updated cask to ${TAP_REPO}"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 3b: flip from draft → public if requested.
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [prepare, build, manifest]
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same gate on the draft→public flip, so the moment a release goes
    # live also requires an approver from the "release" environment.
    environment: release
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
            core.info("Release published.");

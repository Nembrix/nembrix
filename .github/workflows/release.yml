name: Release

# Manual trigger only — no tag/push events. You bump the version,
# commit, then click "Run workflow" in the Actions tab. The workflow
# creates a draft GitHub Release tagged v<version>, builds artifacts
# in parallel across the four target platforms, attaches them to the
# release, and (when "publish" is true) flips it from draft to public.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no leading 'v'). Read from apps/desktop/src-tauri/tauri.conf.json if blank."
        required: false
        type: string
      publish:
        description: "Publish the release immediately (otherwise leave as draft)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Cancel an older Release run for the same version if a new one starts —
# avoids two concurrent runs racing each other when re-clicking the button.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: prepare the draft release so each platform job can
  # upload to it. Reads the version from inputs or tauri.conf.json.
  # ─────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # Gate the whole release behind the "release" environment. Configure
    # its required reviewers in repo Settings → Environments → release so
    # the run pauses for approval before any release is created — only
    # designated approvers can actually cut a release, regardless of who
    # clicked "Run workflow".
    # NOTE: editor YAML-schema linters may flag `environment: release` as
    # "not valid" — that's a known false positive (they can't see the
    # repo's configured environments). GitHub Actions accepts it fine.
    environment: release
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.create.outputs.release_id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: resolve
        name: Resolve version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      - id: create
        name: Create / update draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        with:
          script: |
            const { TAG, VERSION, PRERELEASE } = process.env;
            // Find an existing release by tag (so reruns don't pile up
            // duplicate drafts). Releases endpoint paginates; 100 is
            // plenty for our cadence.
            const list = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100,
            });
            const existing = list.data.find(r => r.tag_name === TAG);
            let release;
            if (existing) {
              core.info(`Reusing existing release ${existing.id} for ${TAG}`);
              release = existing;
            } else {
              core.info(`Creating new draft release for ${TAG}`);
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                tag_name: TAG,
                name: `Nembrix ${VERSION}`,
                draft: true,
                prerelease: PRERELEASE === "true",
                generate_release_notes: true,
              });
              release = created.data;
            }
            core.setOutput("release_id", String(release.id));
            core.setOutput("upload_url", release.upload_url);

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: build each target in parallel. Uses tauri-action which
  # handles the signing (Apple notarize, Windows code-sign) when the
  # right secrets are present, and falls through cleanly when not.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false  # One platform failing shouldn't kill the others.
      matrix:
        include:
          # ── macOS ──────────────────────────────────────────────
          - label: macOS (universal)
            slug: macos-universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: "x86_64-apple-darwin,aarch64-apple-darwin"
            args: --target universal-apple-darwin
          - label: macOS Intel (x86_64)
            slug: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: macOS Apple Silicon (aarch64)
            slug: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          # ── Windows ────────────────────────────────────────────
          - label: Windows x64
            slug: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          - label: Windows x86 (32-bit)
            slug: windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc
            rust_targets: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc
          - label: Windows ARM64
            slug: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc

          # ── Linux (each emits .deb, .AppImage, .rpm) ───────────
          - label: Linux x86_64
            slug: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
          - label: Linux arm64
            slug: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ─── Toolchain ─────────────────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop -> apps/desktop/target
          key: ${{ matrix.target }}

      # ─── Linux build deps ──────────────────────────────────────
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ─── arm64 cross deps (Linux arm64 only) ───────────────────
      - name: Install arm64 cross-compile deps
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # Add ports.ubuntu.com sources for arm64 packages.
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list.d/arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF'
          # Restrict the default sources to amd64 so apt doesn't try to
          # fetch arm64 from the wrong mirror.
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libssl-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64

      # ─── Frontend ──────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ─── Updater endpoint ──────────────────────────────────────
      # tauri.conf.json ships the updater endpoint with __OWNER__/__REPO__
      # placeholders so the repo is forkable without editing config. Bake
      # the actual repo coordinates in here, just before the build, from
      # the GitHub context. The pubkey is already committed (it isn't
      # secret); only the matching TAURI_SIGNING_PRIVATE_KEY secret signs.
      - name: Set updater endpoint
        shell: bash
        run: |
          CONF=apps/desktop/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          sed -e "s/__OWNER__/${{ github.repository_owner }}/g" \
              -e "s/__REPO__/${{ github.event.repository.name }}/g" \
              "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          echo "Updater endpoint:"; grep -A1 endpoints "$CONF"

      # ─── Tauri build + sign + upload ───────────────────────────
      - name: Build & upload
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Tauri auto-updater: signs the update bundles + latest.json.
          #    When TAURI_SIGNING_PRIVATE_KEY is unset the build still
          #    produces installers, but the .sig files (and thus a working
          #    updater) are skipped — ship the key secret to enable updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # The frontend project + Tauri shell both live under the
          # desktop app workspace. tauri-action runs `yarn build`
          # from this path, so vite + tsc see the right tsconfig.
          projectPath: apps/desktop
          # Generate latest.json (the updater manifest) from the artifacts
          # actually built and attach it to the release. The app's updater
          # endpoint points at this file — no hand-maintained manifest, no
          # drift between what shipped and what the updater advertises.
          includeUpdaterJson: true
          # Pull request builds skip signing/uploading. The tag is set
          # via the prepare job's tag output; tauri-action attaches the
          # built artifacts to that release.

      # ─── Windows signing (separate pass — Tauri's signing hook is
      #     Apple-only; on Windows we sign the produced installers
      #     after the build with signtool). Only runs when the cert
      #     secret is present, so unsigned dev releases work fine.
      - name: Sign Windows installers
        if: startsWith(matrix.os, 'windows') && env.WIN_CERT_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $bytes)
          # Sign every msi + exe produced by tauri-action. Cross-target
          # builds land under apps/desktop/target/<triple>/release/bundle,
          # so we search the whole target tree.
          $files = Get-ChildItem `
            -Path apps/desktop/target `
            -Recurse `
            -Include *.msi,*.exe
          foreach ($f in $files) {
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $certPath /p $env:WIN_CERT_PASSWORD $f.FullName
          }

      # ─── Collect bundles into release/<slug>/ ───────────────────
      # Walk apps/desktop/target/**/release/bundle and pull out every
      # installer/package format Tauri emits. The exact subfolder layout
      # varies by target (universal vs single-triple), so we glob the
      # whole tree rather than hard-coding paths.
      - name: Collect bundles (unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          DEST="release/${VERSION}/${SLUG}"
          mkdir -p "$DEST"
          # -path is the simplest portable way to scope the search.
          find apps/desktop/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' \
            -o -name '*.app.tar.gz' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.AppImage' \
            -o -name '*.msi' \
            -o -name '*.exe' \) \
            -exec cp -v {} "$DEST/" \;
          echo "── contents of $DEST ──"
          ls -la "$DEST" || true

      - name: Collect bundles (windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          $dest = "release/$env:VERSION/$env:SLUG"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $files = Get-ChildItem `
            -Path apps/desktop/target `
            -Recurse `
            -Include *.msi,*.exe `
            | Where-Object { $_.FullName -match 'release[\\/]bundle[\\/]' }
          foreach ($f in $files) {
            Copy-Item -Path $f.FullName -Destination $dest -Force
            Write-Host "copied $($f.FullName)"
          }
          Get-ChildItem $dest

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nembrix-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: release/${{ needs.prepare.outputs.version }}/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Stage 2.5: gather every per-platform artifact, generate a
  # checksums.txt (sha256 of every file) and a structured
  # manifest.json, and attach both to the GitHub Release alongside
  # the loose installer assets that tauri-action already uploaded.
  # ─────────────────────────────────────────────────────────────────
  manifest:
    name: Attach checksums + manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pulls every artifact uploaded by the matrix build jobs into
      # ./release/<version>/<slug>/<files…> — same layout the build
      # jobs produced locally.
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nembrix-${{ needs.prepare.outputs.version }}-*
          path: release/${{ needs.prepare.outputs.version }}
          merge-multiple: false

      - name: Generate checksums.txt and manifest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd "release/${VERSION}"

          # Strip the "nembrix-<version>-" prefix from artifact dir
          # names so the folder layout is release/<version>/<slug>/.
          for d in nembrix-${VERSION}-*/; do
            slug="${d#nembrix-${VERSION}-}"
            slug="${slug%/}"
            mv "$d" "$slug"
          done

          ls -laR

          # SHA256 every file (paths relative to the version folder).
          : > checksums.txt
          find . -type f \
            ! -name checksums.txt \
            ! -name manifest.json \
            -print0 \
          | sort -z \
          | xargs -0 sha256sum > checksums.txt
          echo "── checksums.txt ──"
          cat checksums.txt

          # Build a structured manifest. Each entry: platform, arch,
          # file (relative path), size in bytes, sha256.
          python3 - "$VERSION" <<'PY' > manifest.json
          import hashlib, json, os, sys
          version = sys.argv[1]
          entries = []
          for slug in sorted(os.listdir('.')):
              if not os.path.isdir(slug):
                  continue
              # slug is e.g. "macos-universal", "windows-x86_64".
              parts = slug.split('-', 1)
              platform = parts[0]
              arch = parts[1] if len(parts) > 1 else ''
              for fname in sorted(os.listdir(slug)):
                  fpath = os.path.join(slug, fname)
                  if not os.path.isfile(fpath):
                      continue
                  h = hashlib.sha256()
                  with open(fpath, 'rb') as f:
                      for chunk in iter(lambda: f.read(1 << 20), b''):
                          h.update(chunk)
                  entries.append({
                      'platform': platform,
                      'arch': arch,
                      'slug': slug,
                      'file': fname,
                      'size': os.path.getsize(fpath),
                      'sha256': h.hexdigest(),
                  })
          print(json.dumps({
              'version': version,
              'artifacts': entries,
          }, indent=2))
          PY
          echo "── manifest.json ──"
          cat manifest.json

      - name: Upload checksums + manifest to the Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { RELEASE_ID, VERSION } = process.env;
            const dir = `release/${VERSION}`;
            const files = ['checksums.txt', 'manifest.json'];

            // Drop any prior copies on the release so reruns don't
            // collide on the same name (GitHub rejects duplicates).
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(RELEASE_ID),
              per_page: 100,
            });
            for (const a of assets.data) {
              if (files.includes(a.name)) {
                core.info(`Deleting existing asset ${a.name} (id ${a.id})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  asset_id: a.id,
                });
              }
            }

            for (const name of files) {
              const p = path.join(dir, name);
              const data = fs.readFileSync(p);
              core.info(`Uploading ${name} (${data.length} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                release_id: Number(RELEASE_ID),
                name,
                data,
              });
            }

  # ─────────────────────────────────────────────────────────────────
  # Stage 3a: update the Homebrew tap so `brew install --cask
  # nembrix` resolves to the new version. Skipped silently if the
  # HOMEBREW_TAP_TOKEN secret isn't configured.
  # ─────────────────────────────────────────────────────────────────
  brew:
    name: Update Homebrew tap
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check tap secret
        id: gate
        run: |
          if [[ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping brew tap update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for dmg, compute SHA, render cask, push to tap
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Tap repo defaults to <owner>/homebrew-<repo>. Override with
          # the HOMEBREW_TAP_REPO secret (e.g. "myorg/homebrew-tools").
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO || format('{0}/homebrew-{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set -euo pipefail

          DMG_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/Nembrix_${VERSION}_universal.dmg"
          echo "Fetching $DMG_URL"

          # The dmg upload from the macOS build job races us — poll
          # until the asset is downloadable (or fail after 5 min).
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o dmg.bin -w "%{http_code}" -L -H "Authorization: token ${GH_TOKEN}" "$DMG_URL" || true)
            if [[ "$STATUS" == "200" ]] && [[ -s dmg.bin ]]; then
              echo "dmg ready (try $i)"
              break
            fi
            echo "dmg not ready yet (try $i, status=$STATUS); sleeping…"
            sleep 5
          done
          test -s dmg.bin

          SHA=$(sha256sum dmg.bin | awk '{print $1}')
          echo "sha256: $SHA"

          # Render the cask template.
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256__/${SHA}/g" \
            -e "s/__OWNER__/${OWNER}/g" \
            -e "s/__REPO__/${REPO}/g" \
            .cask/nembrix.rb.tmpl > /tmp/nembrix.rb

          # Clone the tap, drop the rendered cask in, commit, push.
          git config --global user.name  "Nembrix release bot"
          git config --global user.email "release-bot@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

          mkdir -p tap/Casks
          mv /tmp/nembrix.rb tap/Casks/nembrix.rb

          cd tap
          git add Casks/nembrix.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged; nothing to push."
          else
            git commit -m "nembrix ${VERSION}"
            git push
            echo "Pushed updated cask to ${TAP_REPO}"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 3b: flip from draft → public if requested.
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [prepare, build, manifest]
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    # Same gate on the draft→public flip, so the moment a release goes
    # live also requires an approver from the "release" environment.
    environment: release
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
            core.info("Release published.");

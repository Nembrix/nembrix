[workspace]
resolver = "2"
members = [
    # Self-contained desktop-app workspace: Tauri shell plus every
    # crate it consumes. If we ever spin up a second Rust app, it'd
    # get its own workspace (separate Cargo.lock, separate target/)
    # — or we'd hoist the shared crates to a repo-level workspace.
    "src-tauri",
    "crates/db-core",
    "crates/db-postgres",
    "crates/db-mongo",
    "crates/db-script",
    "crates/ssh-tunnel",
    "crates/secrets",
    "crates/sql-format",
]

[workspace.package]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mongo"] }

async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
specta = { version = "2.0.0-rc", features = ["derive", "serde", "serde_json", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }

# Mongo. The driver bundles its own connection pooling, so unlike the
# Postgres path there's no sqlx-style Pool to manage by hand. We use
# mongodb's re-exported `bson` everywhere (mongodb 3.x defaults to
# bson 3) so a single bson version flows through the public API — no
# separate top-level `bson` dep, which would risk a v2/v3 type split.
mongodb = "3"

# Pinned to 0.43.x — 0.44 reorganized the public re-exports and 0.45
# renamed several auth methods. Migrating is a sizeable lift we don't
# want to do today; 0.43 has the API this code was written against and
# is still receiving security backports.
russh = "0.43"
russh-keys = "0.43"

keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

sqlformat = "0.2"

db-core = { path = "crates/db-core" }
db-postgres = { path = "crates/db-postgres" }
db-mongo = { path = "crates/db-mongo" }
ssh-tunnel = { path = "crates/ssh-tunnel" }
secrets = { path = "crates/secrets" }
sql-format = { path = "crates/sql-format" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

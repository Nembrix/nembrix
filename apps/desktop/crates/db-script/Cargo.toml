[package]
name = "db-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# JS scripting mode for RDBMS connections. Embeds QuickJS (via rquickjs) so a
# user can write `await db.query(...)` with ordinary control flow against a live
# SQL connection. The engine is handed exactly one capability — a `db.query`
# host function — and nothing else: no fs, no net, no timers. See
# docs/design/js-scripting-mode.html.

[dependencies]
db-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
thiserror.workspace = true

# `futures` feature pulls in the async runtime + AsyncContext so host functions
# can be `async` and suspend the JS engine while a real query streams.
rquickjs = { version = "0.12", features = ["futures"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
anyhow.workspace = true

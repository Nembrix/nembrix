<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nembrix mark: the database "drum".

  A rounded-square icon in the app's silver-to-slate plate, with a solid
  3D database drum: a gradient blue lid (lit at top), a dark charcoal
  body, and a lit white front face reading as the drum's near wall. Self
  contained (includes its own tile), so it is used directly as the app
  bundle icon and in the About dialog.

  Replaces the earlier flat "expansion hex". Colors stay in the app's
  accent family (lid #3b82f6-ish) over neutral silver so it reads as a
  real, premium app icon rather than a flat glyph on black.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  width="512" height="512"
  role="img"
  aria-label="Nembrix"
>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.55" stop-color="#dfe4ea"/>
      <stop offset="1" stop-color="#cdd4dd"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83abf4"/>
      <stop offset="0.5" stop-color="#5285ec"/>
      <stop offset="1" stop-color="#3068d9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#plate)"/>
  <rect x="6" y="6" width="116" height="60" rx="28" fill="#ffffff" opacity="0.20"/>

  <path d="M32 46 V82 A32 13 0 0 0 96 82 V46 Z" fill="#1b2432"/>
  <path d="M48 55 V86 A16 6 0 0 0 80 86 V55 Z" fill="url(#face)"/>
  <path d="M48 55 A16 6 0 0 0 80 55" fill="none" stroke="#c3ccd8" stroke-width="1.4" opacity="0.65"/>
  <ellipse cx="64" cy="46" rx="32" ry="13" fill="url(#lid)"/>
  <ellipse cx="64" cy="45" rx="32" ry="13" fill="none" stroke="#aecaf9" stroke-width="1.2" opacity="0.55"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nembrix wordmark: the outline database-puck mark + the name "nembrix".

  Horizontal lockup. The mark (dark hollow body, steel-blue lid) sits at
  left; the name follows in the platform UI font (SF Pro / Inter / Segoe
  UI), weight 700, tight tracking. The leading "n" is the accent blue;
  "embrix" is ink. The name is live text so it stays editable.

  Mark geometry mirrors brand/nembrix-mark.svg (96x96, transparent).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="Nembrix">
  <!-- mark, ~96px tall at left -->
  <g transform="translate(16,12)">
    <path d="M23,30 V61 a25,11 0 0 0 50,0 V30" fill="none" stroke="#17181A" stroke-width="10"/>
    <ellipse cx="48" cy="30" rx="30" ry="10.5" fill="#5a86c4"/>
  </g>
  <text x="128" y="82" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2.5"><tspan fill="#3b82f6">n</tspan><tspan fill="#1f2937">embrix</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nembrix wordmark — forked-N mark + name + slogan lockup. Use in
  marketing surfaces (README header, docs hero, social previews).
  Mark scaled to 56px, type uses system sans so the lockup renders
  identically across the app, docs, and OS surfaces.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 80"
  width="360" height="80"
  role="img"
  aria-label="Nembrix"
>
  <defs>
    <linearGradient id="nembrix-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="nembrix-fg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5edff" />
    </linearGradient>
  </defs>

  <g transform="translate(12, 12)">
    <rect width="56" height="56" rx="10" fill="url(#nembrix-bg)" />
    <g transform="scale(0.875)">
      <rect x="13" y="14" width="6" height="38" rx="3" fill="url(#nembrix-fg)" />
      <path d="M 13 14 L 19 14 L 47.5 36 L 43.5 36 Z" fill="url(#nembrix-fg)" />
      <path d="M 43.5 36 L 51.5 21.5 L 55 23 L 47 37.5 Z" fill="url(#nembrix-fg)" />
      <path d="M 43.5 36 L 51.5 50.5 L 55 49 L 47 34.5 Z" fill="url(#nembrix-fg)" />
      <circle cx="45" cy="36" r="5.5" fill="url(#nembrix-fg)" />
      <circle cx="16" cy="11" r="3.2" fill="url(#nembrix-fg)" />
      <circle cx="53" cy="22" r="3.2" fill="url(#nembrix-fg)" />
      <circle cx="53" cy="50" r="3.2" fill="url(#nembrix-fg)" />
    </g>
  </g>

  <text
    x="88" y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-0.8"
    fill="#1f2937"
  >Nembrix</text>
  <text
    x="88" y="60"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="1.4"
    fill="#6b7280"
  >CONNECT · QUERY · CONTROL</text>
</svg>
